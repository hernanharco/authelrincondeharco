# BLOQUE 1: REDIRECCIÓN HTTP -> HTTPS
server {
    listen 80;
    # Escuchamos ambos dominios en el puerto 80
    server_name lcl-auth.elrincondeharco.com apilcl-auth.elrincondeharco.com;
    
    location / {
        # Redirigimos usando $http_host para mantener el puerto :444 en la URL
        return 301 https://$http_host$request_uri;
    }
}

# BLOQUE 2: FRONTEND (Astro)
server {
    listen 443 ssl;
    server_name lcl-auth.elrincondeharco.com;

    # Certificados para el Frontend
    ssl_certificate /etc/ssl/certs/frd.pem;
    ssl_certificate_key /etc/ssl/certs/frd-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frd-authcore:4321;
        proxy_set_header Host $http_host; # Mantiene el puerto :444
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Soporte para WebSockets (útil si usas HMR o streaming en Astro)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# BLOQUE 3: BACKEND (FastAPI)
server {
    listen 443 ssl;
    server_name apilcl-auth.elrincondeharco.com;

    # Certificados para la API
    ssl_certificate /etc/ssl/certs/auth.pem;
    ssl_certificate_key /etc/ssl/certs/auth-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://bkd-authcore:8000; 
        proxy_set_header Host $http_host; # Crucial para que el backend reconozca el puerto :444
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Evita problemas de buffering en respuestas grandes
        proxy_buffering off;
    }
}