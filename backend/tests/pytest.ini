[tool:pytest]
# Configuración de pytest para AuthCore

# Directorios de tests
testpaths = tests

# Patrones de archivos de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de ejecución
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Marcadores personalizados
markers =
    unit: Tests unitarios (pruebas aisladas)
    integration: Tests de integración (requieren base de datos)
    slow: Tests que toman mucho tiempo
    auth: Tests relacionados con autenticación
    users: Tests relacionados con gestión de usuarios
    oauth: Tests relacionados con OAuth
    security: Tests relacionados con seguridad
    database: Tests que requieren base de datos

# Mínimo de cobertura
minversion = 6.0

# Filtrado de advertencias
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sqlalchemy.*
