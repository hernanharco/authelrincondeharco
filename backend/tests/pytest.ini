[tool:pytest]
# Configuración de pytest para AuthCore

# Directorios de tests
testpaths = tests

# Patrones de archivos de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de ejecución
# NOTA (gate de cobertura): los flags --cov* se movieron a backend/pyproject.toml
# [tool.pytest.ini_options] addopts, que es la config que pytest aplica al correr
# desde backend/ (aquí solo aplica si se pasa un path bajo tests/ como arg, y aun
# asi esta seccion [tool:pytest] es invalida en un .ini → nada de esto se aplica).
# Se dejan sin flags --cov* para que, si alguien corrige la seccion, no se
# duplique el gate (--cov-fail-under=80 dos veces).
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Marcadores personalizados
markers =
    unit: Tests unitarios (pruebas aisladas)
    integration: Tests de integración (requieren base de datos)
    slow: Tests que toman mucho tiempo
    auth: Tests relacionados con autenticación
    users: Tests relacionados con gestión de usuarios
    oauth: Tests relacionados con OAuth
    security: Tests relacionados con seguridad
    database: Tests que requieren base de datos

# Mínimo de cobertura
minversion = 6.0

# Filtrado de advertencias
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sqlalchemy.*
